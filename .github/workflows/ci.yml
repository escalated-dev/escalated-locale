name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate locale parity
        run: python scripts/validate_locales.py
      - name: Sync package copies
        shell: pwsh
        run: ./scripts/sync.ps1
      - name: Verify generated files are committed
        run: git diff --exit-code
