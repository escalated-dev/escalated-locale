name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate locale parity
        run: python scripts/validate_locales.py
      - name: Sync package copies
        shell: pwsh
        run: ./scripts/sync.ps1
      - name: Verify generated files are committed
        run: git diff --exit-code

  nuget:
    name: NuGet contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Audit, build and verify source and packaged locale contracts
        run: python scripts/test_nuget.py
