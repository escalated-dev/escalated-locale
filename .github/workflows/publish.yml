name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - shell: pwsh
        run: ./scripts/sync.ps1
      - name: Publish npm package
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN is not configured. Skipping npm publish."
            exit 0
          fi
          cd packages/npm
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Composer publish note
        run: echo "Packagist should auto-sync this repository. No push step is required here."

  rubygems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - shell: pwsh
        run: ./scripts/sync.ps1
      - name: Publish gem
        run: |
          if [ -z "${RUBYGEMS_API_KEY}" ]; then
            echo "RUBYGEMS_API_KEY is not configured. Skipping RubyGems publish."
            exit 0
          fi
          mkdir -p ~/.gem
          printf ":rubygems_api_key: %s\n" "$RUBYGEMS_API_KEY" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          cd packages/rubygems
          gem build escalated-locale.gemspec
          gem push *.gem
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}

  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - shell: pwsh
        run: ./scripts/sync.ps1
      - name: Publish Maven artifact
        run: |
          if [ -z "${MAVEN_USERNAME}" ] || [ -z "${MAVEN_PASSWORD}" ] || [ -z "${MAVEN_GPG_PASSPHRASE}" ]; then
            echo "Maven Central secrets are incomplete. Skipping Maven publish."
            exit 0
          fi
          cd packages/maven
          mvn -B -ntp deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - shell: pwsh
        run: ./scripts/sync.ps1
      - name: Publish NuGet package
        run: |
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "NUGET_API_KEY is not configured. Skipping NuGet publish."
            exit 0
          fi
          cd packages/nuget
          dotnet pack -c Release
          dotnet nuget push bin/Release/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  hex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.0"
          elixir-version: "1.17.3"
      - shell: pwsh
        run: ./scripts/sync.ps1
      - name: Publish Hex package
        run: |
          if [ -z "${HEX_API_KEY}" ]; then
            echo "HEX_API_KEY is not configured. Skipping Hex publish."
            exit 0
          fi
          cd packages/hex
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix hex.config api_key "$HEX_API_KEY"
          mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Go publish note
        run: echo "Go consumers read from Git tags directly. No registry publish step is required."
