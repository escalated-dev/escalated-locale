name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - shell: pwsh
        run: ./scripts/sync.ps1
      - name: Publish npm package
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not configured. Skipping npm publish."
            exit 0
          fi
          cd packages/npm
          npm publish --access public
        env:
          # setup-node@v4 with registry-url writes an .npmrc that reads
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}, so the
          # secret must surface under that exact env name (not NPM_TOKEN).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Composer publish note
        run: echo "Packagist should auto-sync this repository. No push step is required here."

  rubygems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - shell: pwsh
        run: ./scripts/sync.ps1
      - name: Publish gem
        run: |
          if [ -z "${RUBYGEMS_API_KEY}" ]; then
            echo "RUBYGEMS_API_KEY is not configured. Skipping RubyGems publish."
            exit 0
          fi
          mkdir -p ~/.gem
          printf ":rubygems_api_key: %s\n" "$RUBYGEMS_API_KEY" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          cd packages/rubygems
          gem build escalated-locale.gemspec
          gem push *.gem
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}

  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - shell: pwsh
        run: ./scripts/sync.ps1
      - name: Publish Maven artifact
        run: |
          if [ -z "${MAVEN_USERNAME}" ] || [ -z "${MAVEN_PASSWORD}" ] || [ -z "${MAVEN_GPG_PASSPHRASE}" ]; then
            echo "Maven Central secrets are incomplete. Skipping Maven publish."
            exit 0
          fi
          cd packages/maven
          mvn -B -ntp deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - shell: pwsh
        run: ./scripts/sync.ps1
      - name: Publish NuGet package
        run: |
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "NUGET_API_KEY is not configured. Skipping NuGet publish."
            exit 0
          fi
          cd packages/nuget
          dotnet pack -c Release
          dotnet nuget push bin/Release/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  hex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.0"
          elixir-version: "1.17.3"
      - shell: pwsh
        run: ./scripts/sync.ps1
      - name: Publish Hex package
        run: |
          if [ -z "${HEX_API_KEY}" ]; then
            echo "HEX_API_KEY is not configured. Skipping Hex publish."
            exit 0
          fi
          cd packages/hex
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix hex.config api_key "$HEX_API_KEY"
          mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: pwsh
        run: ./scripts/sync.ps1
      - name: Publish PyPI package
        run: |
          if [ -z "${PYPI_API_TOKEN}" ]; then
            echo "PYPI_API_TOKEN is not configured. Skipping PyPI publish."
            exit 0
          fi
          if [ ! -d packages/pypi ]; then
            echo "packages/pypi/ is missing. Skipping PyPI publish."
            exit 0
          fi
          cd packages/pypi
          python -m pip install --upgrade build twine
          python -m build
          python -m twine upload --non-interactive dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Go publish note
        run: echo "Go consumers read from Git tags directly. No registry publish step is required."

  github-release:
    needs: [npm, composer, rubygems, maven, nuget, hex, pypi, go]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # If the release already exists (e.g. publish workflow re-ran), skip cleanly.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists. Skipping creation."
            exit 0
          fi
          gh release create "$tag" \
            --title "$tag" \
            --notes "Automated release for $tag. See the workflow run for per-ecosystem publish status; skipped ecosystems are missing their secret. Go module is available at \`github.com/escalated-dev/escalated-locale@$tag\`."
