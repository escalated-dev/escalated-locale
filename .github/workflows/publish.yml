name: Publish

# Tag a release like `v0.1.0` to publish to all configured ecosystems.
# Each ecosystem job is independent: missing secrets or missing manifests
# cause that one ecosystem to skip with a clear log line — they do NOT block
# the others. Add secrets to GitHub repo settings to activate each ecosystem.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # for the GitHub Release step
  packages: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        name: Extract version from tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Tag '$tag' does not match v<semver>. Got version='$version'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"

      - name: Run sync.sh
        run: |
          chmod +x scripts/sync.sh 2>/dev/null || true
          bash scripts/sync.sh

  publish-npm:
    name: npm — @escalated-dev/locale
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Skip if package missing or secret unset
        id: gate
        run: |
          if [ ! -f packages/npm/package.json ]; then
            echo "skip=missing packages/npm/package.json" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "skip=missing NPM_TOKEN secret" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=" >> "$GITHUB_OUTPUT"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: steps.gate.outputs.skip != ''
        run: echo "::warning::npm skipped — ${{ steps.gate.outputs.skip }}"
      - if: steps.gate.outputs.skip == ''
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - if: steps.gate.outputs.skip == ''
        run: bash scripts/sync.sh
      - if: steps.gate.outputs.skip == ''
        name: Stamp version & publish
        working-directory: packages/npm
        run: |
          npm version --no-git-tag-version "${{ needs.prepare.outputs.version }}"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-rubygems:
    name: RubyGems — escalated-locale
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Skip if package missing or secret unset
        id: gate
        run: |
          if [ -z "$(find packages/rubygems -maxdepth 1 -name '*.gemspec' 2>/dev/null)" ]; then
            echo "skip=missing packages/rubygems/*.gemspec" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "${RUBYGEMS_API_KEY:-}" ]; then
            echo "skip=missing RUBYGEMS_API_KEY secret" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=" >> "$GITHUB_OUTPUT"
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
      - if: steps.gate.outputs.skip != ''
        run: echo "::warning::RubyGems skipped — ${{ steps.gate.outputs.skip }}"
      - if: steps.gate.outputs.skip == ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - if: steps.gate.outputs.skip == ''
        run: bash scripts/sync.sh
      - if: steps.gate.outputs.skip == ''
        name: Stamp version, build & push
        working-directory: packages/rubygems
        run: |
          version="${{ needs.prepare.outputs.version }}"
          for gemspec in *.gemspec; do
            sed -i -E "s/(spec\.version[[:space:]]*=[[:space:]]*).*/\1\"$version\"/" "$gemspec"
          done
          gem build *.gemspec
          mkdir -p ~/.gem
          umask 0077
          printf -- "---\n:rubygems_api_key: %s\n" "${RUBYGEMS_API_KEY}" > ~/.gem/credentials
          gem push *.gem
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}

  publish-pypi:
    name: PyPI — escalated-locale
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Skip if package missing or secret unset
        id: gate
        run: |
          if [ ! -f packages/pypi/pyproject.toml ] && [ ! -f packages/pypi/setup.py ]; then
            echo "skip=missing packages/pypi/pyproject.toml or setup.py" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "${PYPI_API_TOKEN:-}" ]; then
            echo "skip=missing PYPI_API_TOKEN secret" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=" >> "$GITHUB_OUTPUT"
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      - if: steps.gate.outputs.skip != ''
        run: echo "::warning::PyPI skipped — ${{ steps.gate.outputs.skip }}"
      - if: steps.gate.outputs.skip == ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - if: steps.gate.outputs.skip == ''
        run: bash scripts/sync.sh
      - if: steps.gate.outputs.skip == ''
        name: Stamp version, build & upload
        working-directory: packages/pypi
        run: |
          version="${{ needs.prepare.outputs.version }}"
          if [ -f pyproject.toml ]; then
            python -c "
          import re, pathlib
          p = pathlib.Path('pyproject.toml')
          t = p.read_text()
          t = re.sub(r'^version\s*=\s*\".*\"', f'version = \"$version\"', t, count=1, flags=re.M)
          p.write_text(t)
          "
          fi
          python -m pip install --upgrade build twine
          python -m build
          python -m twine upload --non-interactive dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  publish-nuget:
    name: NuGet — Escalated.Locale
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Skip if package missing or secret unset
        id: gate
        run: |
          if [ -z "$(find packages/nuget -maxdepth 1 -name '*.csproj' 2>/dev/null)" ]; then
            echo "skip=missing packages/nuget/*.csproj" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "skip=missing NUGET_API_KEY secret" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=" >> "$GITHUB_OUTPUT"
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      - if: steps.gate.outputs.skip != ''
        run: echo "::warning::NuGet skipped — ${{ steps.gate.outputs.skip }}"
      - if: steps.gate.outputs.skip == ''
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - if: steps.gate.outputs.skip == ''
        run: bash scripts/sync.sh
      - if: steps.gate.outputs.skip == ''
        name: Pack & push
        working-directory: packages/nuget
        run: |
          version="${{ needs.prepare.outputs.version }}"
          dotnet pack -c Release -p:Version="$version" -o ./out
          dotnet nuget push ./out/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  publish-hex:
    name: Hex — :escalated_locale
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Skip if package missing or secret unset
        id: gate
        run: |
          if [ ! -f packages/hex/mix.exs ]; then
            echo "skip=missing packages/hex/mix.exs" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "${HEX_API_KEY:-}" ]; then
            echo "skip=missing HEX_API_KEY secret" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=" >> "$GITHUB_OUTPUT"
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      - if: steps.gate.outputs.skip != ''
        run: echo "::warning::Hex skipped — ${{ steps.gate.outputs.skip }}"
      - if: steps.gate.outputs.skip == ''
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
      - if: steps.gate.outputs.skip == ''
        run: bash scripts/sync.sh
      - if: steps.gate.outputs.skip == ''
        name: Stamp version & publish
        working-directory: packages/hex
        run: |
          version="${{ needs.prepare.outputs.version }}"
          sed -i -E "s/(version:[[:space:]]*)\".*\"/\1\"$version\"/" mix.exs
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          HEX_API_KEY="$HEX_API_KEY" mix hex.publish package --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  publish-maven:
    name: Maven Central — dev.escalated:escalated-locale
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Skip if package missing or secrets unset
        id: gate
        run: |
          if [ ! -f packages/maven/pom.xml ]; then
            echo "skip=missing packages/maven/pom.xml" >> "$GITHUB_OUTPUT"; exit 0
          fi
          missing=()
          [ -z "${MAVEN_USERNAME:-}" ]      && missing+=(MAVEN_USERNAME)
          [ -z "${MAVEN_PASSWORD:-}" ]      && missing+=(MAVEN_PASSWORD)
          [ -z "${MAVEN_GPG_PRIVATE_KEY:-}" ] && missing+=(MAVEN_GPG_PRIVATE_KEY)
          [ -z "${MAVEN_GPG_PASSPHRASE:-}" ]  && missing+=(MAVEN_GPG_PASSPHRASE)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "skip=missing secrets: ${missing[*]}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=" >> "$GITHUB_OUTPUT"
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - if: steps.gate.outputs.skip != ''
        run: echo "::warning::Maven skipped — ${{ steps.gate.outputs.skip }}"
      - if: steps.gate.outputs.skip == ''
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - if: steps.gate.outputs.skip == ''
        run: bash scripts/sync.sh
      - if: steps.gate.outputs.skip == ''
        name: Stamp version & deploy
        working-directory: packages/maven
        run: |
          version="${{ needs.prepare.outputs.version }}"
          mvn -B versions:set -DnewVersion="$version" -DgenerateBackupPoms=false
          mvn -B -P release deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  packagist-trigger:
    name: Packagist — escalated-dev/locale (sync trigger)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Skip if secrets unset
        id: gate
        run: |
          if [ -z "${PACKAGIST_USERNAME:-}" ] || [ -z "${PACKAGIST_TOKEN:-}" ]; then
            echo "skip=missing PACKAGIST_USERNAME or PACKAGIST_TOKEN — once webhook is configured on Packagist, this trigger is optional anyway" >> "$GITHUB_OUTPUT"
          else
            echo "skip=" >> "$GITHUB_OUTPUT"
          fi
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
      - if: steps.gate.outputs.skip != ''
        run: echo "::warning::Packagist trigger skipped — ${{ steps.gate.outputs.skip }}"
      - if: steps.gate.outputs.skip == ''
        run: |
          curl -sS -XPOST -H 'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/escalated-dev/escalated-locale"}}' | jq .
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}

  github-release:
    name: GitHub Release (also makes the Go module fetchable)
    needs: [prepare, publish-npm, publish-rubygems, publish-pypi, publish-nuget, publish-hex, publish-maven, packagist-trigger]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "Auto-generated release for $tag.

          See per-ecosystem publish jobs in this workflow run for status. Skipped ecosystems are missing manifest or secret — see job logs.

          Go module is available immediately at \`github.com/escalated-dev/escalated-locale@$tag\`."
